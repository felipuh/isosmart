# Nginx Configuration for IsoSmart
# This configuration serves the IsoSmart application on port 80
# and proxies API requests to the Django backend on port 8001

upstream isosmart_backend {
    server 127.0.0.1:8001;
}

upstream adminapps_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name isosmart.local localhost;
    
    client_max_body_size 50M;
    
    # Django API
    location /api/ {
        proxy_pass http://isosmart_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Admin interface
    location /admin/ {
        proxy_pass http://isosmart_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # Static files
    location /static/ {
        alias /home/aplicacion/projects/isosmart/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Media files
    location /media/ {
        alias /home/aplicacion/projects/isosmart/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Frontend (Static build)
    location / {
        root /home/aplicacion/projects/isosmart/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}

server {
    listen 80;
    server_name adminapps.isosmart.local;

    client_max_body_size 50M;

    # AdminApps API
    location /api/ {
        proxy_pass http://adminapps_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Admin interface
    location /admin/ {
        proxy_pass http://adminapps_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Static files
    location /static/ {
        alias /home/aplicacion/projects/adminapps/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /home/aplicacion/projects/adminapps/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Frontend (Static build)
    location / {
        root /home/aplicacion/projects/adminapps/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
