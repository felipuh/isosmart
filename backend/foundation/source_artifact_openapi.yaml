openapi: 3.0.3
info:
  title: ISO Smart Source Artifact API
  version: 1.0.0
  description: Runtime contract for the seven repository-local operations declared by the immutable source OpenAPI artifact.
security:
  - BearerAuth: []
paths:
  /v1/onboarding/status:
    get:
      operationId: getOnboardingStatus
      summary: Read onboarding and ISO 9000 Foundation Gate state
      responses:
        '200':
          description: Tenant-scoped onboarding status and applicable, answer-key-free learning paths.
          content:
            application/json:
              schema:
                type: object
                required: [foundation_gate]
                properties:
                  foundation_gate:
                    $ref: '#/components/schemas/FoundationGateStatus'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/recommendations:
    get:
      operationId: getRecommendations
      summary: List tenant recommendations
      parameters:
        - name: clause
          in: query
          required: false
          schema: {type: string, maxLength: 80}
      responses:
        '200':
          description: Advisory recommendations; no result authorizes execution.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: {$ref: '#/components/schemas/Recommendation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/recommendations/{id}/basis:
    get:
      operationId: getRecommendationBasis
      summary: Read frozen normative and evidence basis
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Tenant-scoped recommendation provenance.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendationBasisResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/approvals/{id}/decision:
    post:
      operationId: postApprovalDecision
      summary: Record an authorized human decision for an AgentDecision requiring review
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecisionRequest'}
      responses:
        '200':
          description: Append-only decision persisted with event, outbox, and audit records.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalDecisionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/events:
    post:
      operationId: postDomainEvent
      summary: Publish an allowlisted tenant domain event through the transactional outbox
      description: Requires a validated bearer claim with scope domain:events:publish. Payment, tenant provisioning, Foundation Gate completion, and normative publication events are internal/external-boundary events and cannot be injected through this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DomainEventRequest'}
      responses:
        '202':
          description: Event accepted or an identical event replay recognized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainEventResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/evidence:
    post:
      operationId: postEvidence
      summary: Record immutable evidence and provenance
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvidenceCreateRequest'}
      responses:
        '201':
          description: Evidence created with event, outbox, audit, tenant, and trace references.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceCreateResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/learning/iso9000/attempts:
    post:
      operationId: postFoundationAttempt
      summary: Evaluate and persist an ISO 9000:2026 Foundation Gate attempt
      description: Score and pass status are calculated server-side. Critical questions require a correct answer. Correct options and explanations are returned only after submission.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FoundationAttemptRequest'}
      responses:
        '201':
          description: Immutable attempt and mastery recorded; completion event/outbox emitted only on pass.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FoundationAttemptResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Request schema or parameter is invalid.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized:
      description: Authentication is required.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Authenticated identity, tenant, or role is not authorized.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Resource does not exist in the authenticated tenant.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: State, idempotency, or aggregate version conflict.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unprocessable:
      description: A semantically invalid request or learning attempt was supplied.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: Tenant authority or PostgreSQL runtime roles are unavailable.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      type: object
      required: [code, detail]
      properties:
        code: {type: string}
        detail: {type: string}
    FoundationGateStatus:
      type: object
      required: [required, status, unlocks_quality_baseline, paths, latest_attempt]
      properties:
        required: {type: boolean, enum: [true]}
        status: {type: string, enum: [content_unavailable, not_started, retraining_required, passed]}
        unlocks_quality_baseline: {type: boolean}
        latest_attempt:
          allOf: [{$ref: '#/components/schemas/FoundationAttemptSummary'}]
          nullable: true
        completion_attempt_id: {type: string, format: uuid, nullable: true}
        concept_mastery:
          type: array
          items:
            type: object
            required: [concept_key]
            properties:
              concept_key: {type: string}
              score: {type: string, nullable: true}
              last_assessed_at: {type: string, format: date-time, nullable: true}
              retraining_due_at: {type: string, format: date-time, nullable: true}
        paths:
          type: array
          items: {$ref: '#/components/schemas/LearningPath'}
    LearningPath:
      type: object
      required: [id, edition_id, edition, standard_code, required_score, questions]
      properties:
        id: {type: string, format: uuid}
        edition_id: {type: string, format: uuid}
        edition: {type: string}
        standard_code: {type: string}
        role_code: {type: string, nullable: true}
        industry_code: {type: string, nullable: true}
        required_score: {type: string, pattern: '^\\d{1,3}\\.\\d{2}$'}
        questions:
          type: array
          items:
            type: object
            required: [id, concept_key, scenario, options]
            properties:
              id: {type: string, format: uuid}
              concept_key: {type: string}
              difficulty: {type: integer, nullable: true}
              scenario: {type: string}
              options:
                type: array
                items:
                  type: object
                  required: [id, label]
                  properties:
                    id: {type: string}
                    label: {type: string}
    FoundationAttemptSummary:
      type: object
      required: [id, learning_path_id, score, passed, weak_concepts, provenance_hash, completed_at]
      properties:
        id: {type: string, format: uuid}
        learning_path_id: {type: string, format: uuid}
        score: {type: string}
        passed: {type: boolean}
        weak_concepts: {type: array, items: {type: string}}
        provenance_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        completed_at: {type: string, format: date-time}
    FoundationAnswer:
      type: object
      required: [question_id, selected_option_ids]
      properties:
        question_id: {type: string, format: uuid}
        selected_option_ids: {type: array, minItems: 1, items: {type: string, maxLength: 160}}
    FoundationAttemptRequest:
      type: object
      required: [learning_path_id, answers]
      properties:
        learning_path_id: {type: string, format: uuid}
        answers: {type: array, minItems: 1, maxItems: 200, items: {$ref: '#/components/schemas/FoundationAnswer'}}
    FoundationAttemptResponse:
      type: object
      required: [attempt_id, learning_path_id, standard_edition_id, score, passed, weak_concepts, feedback, provenance_hash, audit_id, completed_at]
      properties:
        attempt_id: {type: string, format: uuid}
        learning_path_id: {type: string, format: uuid}
        standard_edition_id: {type: string, format: uuid}
        score: {type: string}
        passed: {type: boolean}
        weak_concepts: {type: array, items: {type: string}}
        feedback:
          type: array
          items:
            type: object
            required: [question_id, concept_key, correct, correct_option_ids]
            properties:
              question_id: {type: string, format: uuid}
              concept_key: {type: string}
              correct: {type: boolean}
              correct_option_ids: {type: array, items: {type: string}}
              explanation: {type: string, nullable: true}
        provenance_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        event_id: {type: string, format: uuid, nullable: true}
        outbox_id: {type: string, format: uuid, nullable: true}
        audit_id: {type: string, format: uuid}
        completed_at: {type: string, format: date-time}
    Recommendation:
      type: object
      required: [id, title, body, confidence, assumptions, status, intended_autonomy, created_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string}
        confidence: {type: string}
        assumptions: {type: array, items: {type: string}}
        impact: {type: string, nullable: true}
        status: {type: string, enum: [proposed]}
        intended_autonomy: {type: string, pattern: '^A[0-4]$'}
        created_at: {type: string, format: date-time}
    RecommendationBasisResponse:
      type: object
      required: [recommendation_id, basis]
      properties:
        recommendation_id: {type: string, format: uuid}
        basis:
          type: array
          items:
            type: object
            required: [id, standard, edition, requirement_code, requirement_text, rule_id, rule_version, evidence_id, evidence_hash, rationale, model, trace_id, created_at]
            properties:
              id: {type: string, format: uuid}
              standard: {type: string}
              edition: {type: string}
              requirement_code: {type: string}
              requirement_text: {type: string}
              rule_id: {type: string, format: uuid}
              rule_version: {type: string}
              evidence_id: {type: string, format: uuid}
              evidence_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
              evidence_revision: {type: integer}
              rationale: {type: string}
              model: {type: object}
              trace_id: {type: string, format: uuid}
              created_at: {type: string, format: date-time}
    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, reject, request_changes]}
        comments: {type: string, maxLength: 4000}
    ApprovalDecisionResponse:
      type: object
      required: [approval_id, decision, event_id, outbox_id, audit_id]
      properties:
        approval_id: {type: string, format: uuid}
        decision: {type: string, enum: [approve, reject, request_changes]}
        event_id: {type: string, format: uuid}
        outbox_id: {type: string, format: uuid}
        audit_id: {type: string, format: uuid}
    DomainEventRequest:
      type: object
      required: [event_id, event_type, aggregate_type, aggregate_id, aggregate_version, occurred_at, trace_id, payload]
      properties:
        event_id: {type: string, format: uuid}
        event_type:
          type: string
          enum: [context.signal.detected, stakeholder.requirement.changed, kpi.threshold.breached, supplier.performance.degraded, customer.complaint.received, change.requested, document.updated, measurement.out_of_tolerance, audit.finding.created, nonconformity.detected]
        aggregate_type: {type: string, maxLength: 120}
        aggregate_id: {type: string, format: uuid}
        aggregate_version: {type: integer, minimum: 1}
        occurred_at: {type: string, format: date-time}
        trace_id: {type: string, format: uuid}
        correlation_id: {type: string, format: uuid, nullable: true}
        causation_id: {type: string, format: uuid, nullable: true}
        payload: {type: object, additionalProperties: true}
    DomainEventResponse:
      type: object
      required: [event_id, duplicate]
      properties:
        event_id: {type: string, format: uuid}
        outbox_id: {type: string, format: uuid}
        audit_id: {type: string, format: uuid}
        duplicate: {type: boolean}
    EvidenceCreateRequest:
      type: object
      required: [organization_id, source_type, captured_at]
      properties:
        organization_id: {type: string, format: uuid}
        source_type: {type: string, maxLength: 80}
        source_uri: {type: string, nullable: true}
        content_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        captured_at: {type: string, format: date-time}
        trust_score: {type: number, minimum: 0, maximum: 1, nullable: true}
        document_version_id: {type: string, format: uuid, nullable: true}
        change_reason: {type: string, nullable: true}
      oneOf:
        - required: [content_hash]
        - required: [document_version_id]
    EvidenceCreateResponse:
      type: object
      required: [evidence_id, lineage_id, event_id, outbox_id, audit_id, trace_id]
      properties:
        evidence_id: {type: string, format: uuid}
        lineage_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        outbox_id: {type: string, format: uuid}
        audit_id: {type: string, format: uuid}
        trace_id: {type: string, format: uuid}